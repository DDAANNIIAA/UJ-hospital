<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مستشفى الجامعة الأردنية</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #ffffff;
            background-image: 
                radial-gradient(circle, rgba(0, 0, 0, 0.15) 1px, transparent 1px);
            background-size: 20px 20px;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            position: relative;
        }

       
        .phone-frame {
            width: 302.81px;
            height: 611.14px;
            background: #d4e157;
            background-image: 
                radial-gradient(circle, rgba(0, 0, 0, 0.15) 1px, transparent 1px);
            background-size: 20px 20px;
            border-radius: 50px;
            border: 15px solid #1a1a1a;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4);
            position: relative;
            overflow: hidden;
        }

        .notch {
            width: 150px;
            height: 30px;
            background: #1a1a1a;
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            border-radius: 0 0 20px 20px;
            z-index: 100;
        }
      .screen-content {
            width: 100%;
            height: 100%;
            padding: 50px 20px 30px;
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
        }

       
        .top-bar {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 10px;
            position: absolute;
            top: 15px;
            left: 0;
            z-index: 10;
        }

           .info-btn {
            width: 35px;
            height: 35px;
            border-radius: 50%;
            border: 2px solid #1c586a;
            background: transparent;
            color: #1c586a;
            font-size: 20px;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s;
        }
  
        .info-btn:hover {
            background: rgba(28, 88, 106, 0.1);
        }

  
        .next-btn {
            background: #1c586a;
            color: white;
            border: none;
            padding: 10px 25px;
            border-radius: 25px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 4px 10px rgba(28, 88, 106, 0.3);
        }

  
        .next-btn:hover {
            background: #063f4c;
            transform: translateY(-2px);
            box-shadow: 0 6px 15px rgba(28, 88, 106, 0.4);
        }

     
        .main-content {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            flex: 1;
            position: relative;
            margin-top: 40px;
        }
        .speech-bubble {
            background: white;
            border: 3px solid #1c586a;
            border-radius: 25px;
            padding: 20px;
            max-width: 220px;
            position: relative;
            margin-bottom: 15px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.15);
            animation: fadeIn 1s ease;
        }

          @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
       .speech-bubble::after {
            content: '';
            position: absolute;
            bottom: -20px;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 0;
            border-left: 20px solid transparent;
            border-right: 20px solid transparent;
            border-top: 25px solid white;
            filter: drop-shadow(0 3px 0 #1c586a);
        }

        .speech-bubble p {
            color: #1c586a;
            font-size: 13px;
            line-height: 1.5;
            text-align: center;
            margin: 0;
        }

        .character-container {
            position: relative;
            margin-top: 40px;
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% {
                transform: translateY(0px);
            }
            50% {
                transform: translateY(-15px);
            }
        }

        .character-container img {
            width: 290px;
            height: auto;
            display: block;
        }

     
        @media (max-width: 480px) {
            .phone-frame {
                border: 10px solid #1a1a1a;
                border-radius: 40px;
            }

            .speech-bubble {
                max-width: 200px;
                padding: 15px;
            }

            .speech-bubble p {
                font-size: 13px;
            }

            .character-container img {
                width: 120px;
            }
        }
    </style>
</head>
<body>
    <div class="phone-frame">
  
        
        <div class="screen-content">
            <div class="top-bar">
                <button class="info-btn">ℹ</button>
                <button class="next-btn" onclick="goToNext()">التالي</button>
            </div>

            <div class="main-content">
                <div class="speech-bubble">
                    <p><strong>عندك مشكلة معينة مش عارف عند اي قسم او دكتور تروح؟<br>
                    بدك صفحة مواعيد دكتور معين ومش لاقيها؟<br>
                    ما تاكل هم عندي الموضوع!</strong></p>
                </div>
                </div>

                <div class="character-container">
                    <img src="second.png" alt="الدكتور ممدوح">
                </div>
            </div>
        </div>
    </div>

    <script>
        function goToNext() {
          window.location.href = 'third.html';
        }
    </script>
</body>
</html>
